[workspace]
resolver = "3"
members = ["recorder", "viewer"]

[workspace.package]
version = "0.2.0"
authors = ["Masahide Sakamaki <yasami@falys.com>"]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-sys = "0.61.2"
