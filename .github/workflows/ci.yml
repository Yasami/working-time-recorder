name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      # .iss の誤りを PR で見つけるため、デバッグビルドからインストーラーを作る
      - name: Build installer
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages[0].version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DBuildDir=..\target\debug" installer\working-time-recorder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 更新の確認を試せるよう、作ったインストーラーを PR からダウンロードできるようにする
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/installer/*-setup.exe
          if-no-files-found: error
