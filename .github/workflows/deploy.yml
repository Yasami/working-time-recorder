name: Build and Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # コードをチェックアウト
      - uses: actions/checkout@v4

      # Rustのセットアップ
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 依存関係とビルド成果物をキャッシュ
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # ビルド実行
      - name: Build
        run: cargo build --release

      # 実行ファイルをzipにまとめる
      - name: Package
        shell: pwsh
        run: |
          $name = "working-time-recorder-${{ github.ref_name }}-windows-x86_64.zip"
          Compress-Archive -Path target/release/working-time-recorder.exe, target/release/working-time-viewer.exe, README.md -DestinationPath $name
          "ASSET=$name" >> $env:GITHUB_ENV

      # GitHubリリースを作成
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
